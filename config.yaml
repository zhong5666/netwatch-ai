# 巡检设备清单（本地真实环境）
# 格式: 每台设备一个条目。ip 必填，其余可选
devices:
  - name: router
    ip: 10.60.43.254
    kind: gateway     # 宿舍网络网关（网关挂了=全网断）

  - name: ubuntu-vm
    ip: 192.168.253.128
    kind: vm          # VMware Ubuntu 22.04（NAT 网段 .253）
    note: 虚拟机开机后才可达，关机会显示离线（正常现象）

# 巡检设置
check:
  ping_count: 3        # 每次 ping 次数
  ping_timeout: 1      # 单次 ping 超时(秒)
  down_threshold: 2    # 连续 N 次巡检离线判定为“异常”（抗抖动）

# AI 告警（填了才启用 AI 分析）
ai:
  enabled: true
  provider: deepseek

# 通知方式（Hermes cron 投递到微信）
notify:
  channel: weixin
