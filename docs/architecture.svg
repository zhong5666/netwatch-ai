<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" height="560" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb7185"/>
    </marker>
  </defs>

  <rect width="1040" height="560" fill="#020617"/>
  <rect width="1040" height="560" fill="url(#grid)"/>

  <text x="30" y="44" fill="#e2e8f0" font-size="17">netwatch-ai 架构</text>
  <text x="30" y="66" fill="#64748b" font-size="11">巡检编排 · 分层探测 · 规则 + AI 双重判断</text>

  <!-- ============ 连线（先画，压在方块下方） ============ -->
  <!-- config -> netwatch -->
  <path d="M 190 295 H 236" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- netwatch <-> probes（双向：下发 checks / 回收分层明细） -->
  <path d="M 450 262 L 496 190" stroke="#64748b" stroke-width="1.5" fill="none"
        marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- netwatch <-> .state.yaml（虚线双向：读写连续离线次数） -->
  <path d="M 412 372 H 496" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5,4" fill="none"
        marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- netwatch -> analyzer（仅异常时，绕过下方空档） -->
  <path d="M 450 312 H 770 V 205 H 796" stroke="#fbbf24" stroke-width="1.5" fill="none" marker-end="url(#arrow-amber)"/>

  <!-- analyzer -> 告警投递 -->
  <path d="M 905 260 V 316" stroke="#fb7185" stroke-width="1.5" fill="none" marker-end="url(#arrow-rose)"/>

  <!-- ============ 组件 ============ -->
  <!-- A. config.yaml -->
  <rect x="30" y="250" width="160" height="90" rx="6" fill="#0f172a"/>
  <rect x="30" y="250" width="160" height="90" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="44" y="278" fill="#e2e8f0" font-size="12">config.yaml</text>
  <text x="44" y="298" fill="#94a3b8" font-size="9">设备清单</text>
  <text x="44" y="313" fill="#94a3b8" font-size="9">name / ip / checks</text>
  <text x="44" y="328" fill="#94a3b8" font-size="9">阈值 · AI · 通知</text>

  <!-- B. netwatch.py -->
  <rect x="240" y="230" width="210" height="160" rx="6" fill="#0f172a"/>
  <rect x="240" y="230" width="210" height="160" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="254" y="258" fill="#e2e8f0" font-size="12">netwatch.py</text>
  <text x="254" y="276" fill="#6ee7b7" font-size="9">编排层</text>
  <text x="254" y="300" fill="#94a3b8" font-size="9">· 逐台设备跑探测</text>
  <text x="254" y="317" fill="#94a3b8" font-size="9">· 连续离线计数</text>
  <text x="254" y="334" fill="#94a3b8" font-size="9">· down_threshold 判定</text>
  <text x="254" y="351" fill="#94a3b8" font-size="9">· 报告渲染 / [SILENT] 抑制</text>
  <text x="254" y="375" fill="#6ee7b7" font-size="9">· 规则：全网断 or 单台断</text>

  <!-- C. probes.py -->
  <rect x="500" y="90" width="250" height="200" rx="6" fill="#0f172a"/>
  <rect x="500" y="90" width="250" height="200" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="514" y="118" fill="#e2e8f0" font-size="12">probes.py</text>
  <text x="514" y="136" fill="#67e8f9" font-size="9">探测层（跨平台）</text>

  <rect x="514" y="148" width="222" height="30" rx="5" fill="#0f172a"/>
  <rect x="514" y="148" width="222" height="30" rx="5" fill="rgba(8,51,68,0.45)" stroke="#0e7490" stroke-width="1"/>
  <text x="526" y="162" fill="#e2e8f0" font-size="10">ICMP ping</text>
  <text x="526" y="174" fill="#94a3b8" font-size="8">只看 returncode（见踩坑 1）</text>

  <rect x="514" y="182" width="222" height="30" rx="5" fill="#0f172a"/>
  <rect x="514" y="182" width="222" height="30" rx="5" fill="rgba(8,51,68,0.45)" stroke="#0e7490" stroke-width="1"/>
  <text x="526" y="196" fill="#e2e8f0" font-size="10">TCP 端口</text>
  <text x="526" y="208" fill="#94a3b8" font-size="8">绕开禁 ICMP 的设备</text>

  <rect x="514" y="216" width="222" height="30" rx="5" fill="#0f172a"/>
  <rect x="514" y="216" width="222" height="30" rx="5" fill="rgba(8,51,68,0.45)" stroke="#0e7490" stroke-width="1"/>
  <text x="526" y="230" fill="#e2e8f0" font-size="10">HTTP 健康检查</text>
  <text x="526" y="242" fill="#94a3b8" font-size="8">4xx 算在线，5xx 算异常</text>

  <rect x="514" y="250" width="222" height="30" rx="5" fill="#0f172a"/>
  <rect x="514" y="250" width="222" height="30" rx="5" fill="rgba(8,51,68,0.45)" stroke="#0e7490" stroke-width="1"/>
  <text x="526" y="264" fill="#e2e8f0" font-size="10">DNS 解析</text>
  <text x="526" y="276" fill="#94a3b8" font-size="8">抓「网通但 DNS 挂了」</text>

  <!-- C2. .state.yaml -->
  <rect x="500" y="320" width="250" height="70" rx="6" fill="#0f172a"/>
  <rect x="500" y="320" width="250" height="70" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="514" y="346" fill="#e2e8f0" font-size="12">.state.yaml</text>
  <text x="514" y="364" fill="#c4b5fd" font-size="9">每台设备连续离线次数</text>
  <text x="514" y="379" fill="#94a3b8" font-size="9">跟着配置文件走，演示不污染真实巡检</text>

  <!-- D. analyzer.py -->
  <rect x="800" y="150" width="210" height="110" rx="6" fill="#0f172a"/>
  <rect x="800" y="150" width="210" height="110" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="814" y="178" fill="#e2e8f0" font-size="12">analyzer.py</text>
  <text x="814" y="196" fill="#fcd34d" font-size="9">AI 层</text>
  <text x="814" y="216" fill="#94a3b8" font-size="9">· DeepSeek / OpenAI 兼容</text>
  <text x="814" y="231" fill="#94a3b8" font-size="9">· key 只走环境变量</text>
  <text x="814" y="246" fill="#94a3b8" font-size="9">· 只依据巡检数据推理</text>

  <!-- E. 告警投递 -->
  <rect x="800" y="316" width="210" height="86" rx="6" fill="#0f172a"/>
  <rect x="800" y="316" width="210" height="86" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="814" y="344" fill="#e2e8f0" font-size="12">告警投递</text>
  <text x="814" y="362" fill="#fda4af" font-size="9">cron / systemd timer</text>
  <text x="814" y="377" fill="#94a3b8" font-size="9">微信 · 钉钉 · 邮件 · webhook</text>
  <text x="814" y="392" fill="#94a3b8" font-size="9">正常时静默，不刷屏</text>

  <!-- ============ 连线标签 ============ -->
  <text x="196" y="286" fill="#94a3b8" font-size="9">读配置</text>
  <text x="452" y="215" fill="#94a3b8" font-size="9">checks</text>
  <text x="452" y="228" fill="#94a3b8" font-size="9">分层明细</text>
  <text x="418" y="364" fill="#c4b5fd" font-size="9">状态读写</text>
  <text x="470" y="296" fill="#fcd34d" font-size="9">仅异常时：把分层明细交给 AI</text>
  <text x="912" y="292" fill="#fda4af" font-size="9">根因 + 建议</text>

  <!-- ============ 图例 ============ -->
  <rect x="30" y="470" width="980" height="60" rx="6" fill="#0f172a"/>
  <rect x="30" y="470" width="980" height="60" rx="6" fill="rgba(30,41,59,0.35)" stroke="#1e293b" stroke-width="1"/>
  <text x="48" y="494" fill="#e2e8f0" font-size="10">图例</text>
  <line x1="48" y1="512" x2="88" y2="512" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="96" y="516" fill="#94a3b8" font-size="9">数据流向</text>
  <line x1="200" y1="512" x2="240" y2="512" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5,4"
        marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="248" y="516" fill="#94a3b8" font-size="9">状态读写（磁盘持久化）</text>
  <line x1="420" y1="512" x2="460" y2="512" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <text x="468" y="516" fill="#94a3b8" font-size="9">交给 AI</text>
  <line x1="560" y1="512" x2="600" y2="512" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow-rose)"/>
  <text x="608" y="516" fill="#94a3b8" font-size="9">告警出口</text>
  <text x="48" y="522" fill="#475569" font-size="8">配色：灰=配置 · 绿=编排 · 青=探测 · 紫=状态 · 琥珀=AI · 玫红=通知</text>
</svg>
